services:
  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io:latest@sha256:b6aae2572a0bf1a671b1b202365ddcfe16a31fa8a60be89df606705731b55f8b
    container_name: changedetection
    hostname: changedetection
    volumes:
      - changedetection-data:/datastore
    environment:
      - TZ=Asia/Tokyo
      - PLAYWRIGHT_DRIVER_URL=ws://playwright-chrome:3000/?stealth=1
    ports:
      - "127.0.0.1:5050:5000"
    restart: unless-stopped
    depends_on:
      playwright-chrome:
        condition: service_started

  playwright-chrome:
    image: ghcr.io/browserless/chromium@sha256:aa4758d8531bf5f06921caa5f837a16c655469a5c09282d759bb6b311a46dff7
    container_name: playwright-chrome
    hostname: playwright-chrome
    environment:
      - TIMEOUT=600000
      - CONCURRENT=10
    restart: unless-stopped

volumes:
  changedetection-data:
