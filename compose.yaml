services:
  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io:latest@sha256:096dae27b5d677b89f0e810fff95a70403271aa3ff3b6437952d2db9be7e74c5
    container_name: changedetection
    hostname: changedetection
    volumes:
      - changedetection-data:/datastore
    environment:
      - TZ=Asia/Tokyo
      - PLAYWRIGHT_DRIVER_URL=ws://playwright-chrome:3000/?stealth=1
    ports:
      - "127.0.0.1:5050:5000"
    restart: unless-stopped
    depends_on:
      playwright-chrome:
        condition: service_started

  playwright-chrome:
    image: ghcr.io/browserless/chromium@sha256:7baa6a4966cb8e1b0249a50173fdc6ed82e36169031548bf49061f273a583113
    container_name: playwright-chrome
    hostname: playwright-chrome
    environment:
      - TIMEOUT=600000
      - CONCURRENT=10
    restart: unless-stopped

volumes:
  changedetection-data:
