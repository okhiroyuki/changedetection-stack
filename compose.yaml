services:
  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io:latest@sha256:04eaae7915bad711160cb15abe160f6d3fabe98bbbd658509d4b7a654000fb2d
    container_name: changedetection
    hostname: changedetection
    volumes:
      - changedetection-data:/datastore
    environment:
      - TZ=Asia/Tokyo
      - PLAYWRIGHT_DRIVER_URL=ws://playwright-chrome:3000/?stealth=1
    ports:
      - "127.0.0.1:5050:5000"
    restart: unless-stopped
    depends_on:
      playwright-chrome:
        condition: service_started

  playwright-chrome:
    image: ghcr.io/browserless/chromium@sha256:bcad9a1c271ddb9d95f7de5981c68cb2fcc9fd1f07e8da07c4e5c9d1ef4fc099
    container_name: playwright-chrome
    hostname: playwright-chrome
    environment:
      - TIMEOUT=600000
      - CONCURRENT=10
    restart: unless-stopped

volumes:
  changedetection-data:
